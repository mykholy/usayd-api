name: Safe Native Auto Merge (Disabled)
# Governance Guard:
# Automatic unattended merging is STRICTLY DISABLED.
# Reason: GitHub branch protection rules are not enforceable on personal private repositories
# on the current account tier. Unattended auto-merges risk landing code without
# required status checks or human review.
# All PR merges must be verified and executed manually with passing CI and required approvals.

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  arm-auto-merge:
    if: github.event.label.name == 'safe-automerge'
    runs-on: ubuntu-latest
    steps:
      - name: Reject automated merge attempt
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed(
              'Unattended auto-merge is DISABLED per Usayd governance policy. ' +
              'Equivalent branch protection is not available on this private repository plan. ' +
              'Every PR must pass verified CI checks and obtain explicit authorized review before manual merge.'
            );
