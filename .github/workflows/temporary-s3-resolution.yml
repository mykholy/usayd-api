name: Temporary S3 dependency resolution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'feat/USYD-T0032-s3-adapter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, intl, bcmath
          tools: composer:v2
          coverage: none
      - name: Generate compatible Composer manifests
        run: |
          composer require 'league/flysystem-aws-s3-v3:^3.0' --no-interaction --no-scripts --prefer-dist
          composer validate --strict
      - name: Export public dependency manifests
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ('composer.json', 'composer.lock'):
              value = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              print('USAYD_MANIFEST_START ' + name)
              for i in range(0, len(value), 4096):
                  print('USAYD_MANIFEST_DATA ' + value[i:i + 4096])
              print('USAYD_MANIFEST_END ' + name)
          PY
