name: Temporary Symfony security lock resolution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'feat/USYD-T0036-supply-chain-security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, intl, bcmath
          tools: composer:v2
          coverage: none
      - name: Resolve only vulnerable packages
        run: |
          composer --no-plugins --no-scripts update symfony/http-kernel symfony/mailer symfony/routing --with-dependencies --minimal-changes --no-interaction --prefer-dist
          composer --no-plugins --no-scripts validate --strict
          composer --no-plugins --no-scripts audit --locked --no-interaction
          git diff --exit-code -- composer.json
      - name: Export generated lock
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          value = base64.b64encode(Path('composer.lock').read_bytes()).decode('ascii')
          print('USAYD_MANIFEST_START composer.lock')
          for i in range(0, len(value), 4096):
              print('USAYD_MANIFEST_DATA ' + value[i:i + 4096])
          print('USAYD_MANIFEST_END composer.lock')
          PY
