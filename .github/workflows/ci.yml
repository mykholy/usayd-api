name: API CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  api-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: usayd_test
          MYSQL_USER: usayd
          MYSQL_PASSWORD: usayd_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: usayd_test
      DB_USERNAME: usayd
      DB_PASSWORD: usayd_ci_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Check repository bootstrap state
        id: state
        run: |
          if [ -f composer.json ]; then
            echo "is_bootstrapped=true" >> $GITHUB_OUTPUT
            echo "Laravel application detected (composer.json present)."
          else
            echo "is_bootstrapped=false" >> $GITHUB_OUTPUT
            echo "Pre-bootstrap repository state detected (composer.json absent)."
          fi

      # Phase A: Pre-bootstrap verification (verifies governance, scripts, config integrity)
      - name: Set up Python for pre-bootstrap governance verification
        if: steps.state.outputs.is_bootstrapped == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository governance & configuration integrity tests
        if: steps.state.outputs.is_bootstrapped == 'false'
        run: |
          if [ -f scripts/verify_repository_governance.py ]; then
            python scripts/verify_repository_governance.py
          fi
          if [ -f scripts/verify_architecture_boundaries.py ]; then
            python scripts/verify_architecture_boundaries.py
          fi
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f and '.git' not in f]; print('All JSON configurations verified successfully.')"
          echo "Pre-bootstrap verification passed. Full Laravel test battery will activate upon USYD-T0023."

      # Phase B: Post-bootstrap verification (enforces full Laravel, MySQL 8.4, Pint, Pest & OpenAPI checks)
      - name: Set up PHP 8.4
        if: steps.state.outputs.is_bootstrapped == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, intl, bcmath
          coverage: none

      - name: Validate Composer configuration & install dependencies
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: composer validate --strict && composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment & generate application key
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: cp .env.example .env && php artisan key:generate

      - name: Grant MySQL privileges and enable log_bin_trust_function_creators
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password -e "SET GLOBAL log_bin_trust_function_creators = 1; GRANT ALL PRIVILEGES ON *.* TO 'usayd'@'%'; FLUSH PRIVILEGES;"

      - name: Execute migrations on real MySQL 8.4 service
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: php artisan migrate:fresh --no-interaction --force

      - name: Code style verification (Laravel Pint)
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: ./vendor/bin/pint --test

      - name: Verify database foundations & anti-PostgreSQL rules
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: python scripts/verify_database_foundations.py

      - name: Verify concurrency & idempotency harness
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: python scripts/verify_concurrency_harness.py

      - name: Verify Redis queues & failed-job lifecycle
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: python scripts/verify_queue_lifecycle.py

      - name: Execute Pest / PHPUnit test suite
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: php artisan test

      - name: OpenAPI Contract Validation
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: |
          if [ -f scripts/check-openapi.sh ]; then
            bash scripts/check-openapi.sh
          else
            echo "MISSING: scripts/check-openapi.sh is required for contract validation once bootstrapped."
            exit 1
          fi
