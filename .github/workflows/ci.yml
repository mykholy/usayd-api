name: API CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  api-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: usayd_test
          MYSQL_USER: usayd
          MYSQL_PASSWORD: usayd_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: usayd_test
      DB_USERNAME: usayd
      DB_PASSWORD: usayd_ci_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      USAYD_REQUIRE_REDIS_TESTS: '1'
      USAYD_REQUIRE_S3_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Require complete Laravel application
        run: |
          set -euo pipefail
          for file in composer.json composer.lock artisan phpunit.xml scripts/check-openapi.sh; do
            test -f "$file" || { echo "::error::Missing required application file: $file"; exit 1; }
          done

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, intl, bcmath
          coverage: none

      - name: Validate Composer configuration & install dependencies
        run: composer validate --strict && composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment & generate application key
        run: cp .env.example .env && php artisan key:generate

      - name: Grant MySQL privileges and enable log_bin_trust_function_creators
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password -e "SET GLOBAL log_bin_trust_function_creators = 1; GRANT ALL PRIVILEGES ON *.* TO 'usayd'@'%'; FLUSH PRIVILEGES;"

      - name: Execute migrations on real MySQL 8.4 service
        run: php artisan migrate:fresh --no-interaction --force

      - name: Code style verification (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Verify architecture boundaries after bootstrap
        run: python scripts/verify_architecture_boundaries.py

      - name: Verify database foundations & anti-PostgreSQL rules
        run: python scripts/verify_database_foundations.py

      - name: Verify concurrency & idempotency harness
        run: python scripts/verify_concurrency_harness.py

      - name: Verify Redis queues & failed-job lifecycle
        run: python scripts/verify_queue_lifecycle.py

      - name: Start isolated S3-compatible test service
        run: |
          set -euo pipefail
          docker run -d --name usayd-ci-s3 \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=usayd-ci-access \
            -e MINIO_ROOT_PASSWORD=usayd-ci-test-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1 server /data
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:9000/minio/health/live

      - name: Execute PHPUnit test suite
        run: php artisan test

      - name: OpenAPI Contract Validation
        run: bash scripts/check-openapi.sh

      - name: Remove isolated S3-compatible test service
        if: always()
        run: docker rm -f usayd-ci-s3 || true
