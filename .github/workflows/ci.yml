name: API CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  api-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: usayd_test
          MYSQL_USER: usayd
          MYSQL_PASSWORD: usayd_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: usayd_test
      DB_USERNAME: usayd
      DB_PASSWORD: usayd_ci_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      USAYD_REQUIRE_REDIS_TESTS: '1'
      USAYD_REQUIRE_S3_TESTS: '1'
      USAYD_REQUIRE_CLAMAV_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require complete Laravel application
        run: |
          set -euo pipefail
          for file in composer.json composer.lock artisan phpunit.xml scripts/check-openapi.sh; do
            test -f "$file" || { echo "::error::Missing required application file: $file"; exit 1; }
          done

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, intl, bcmath
          coverage: none

      - name: Validate Composer configuration & install dependencies
        run: composer validate --strict && composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment & generate application key
        run: cp .env.example .env && php artisan key:generate

      - name: Verify documented operational bootstrap
        run: |
          set -euo pipefail
          composer check-platform-reqs
          python3 -m unittest discover -s scripts/tests -p test_operational_bootstrap.py
          inventory="$(mktemp)"
          trap 'rm -f "$inventory"' EXIT
          php artisan list --format=json > "$inventory"
          python3 scripts/verify_operational_bootstrap.py composer.lock "$inventory"

      - name: Grant MySQL privileges and enable log_bin_trust_function_creators
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password -e "SET GLOBAL log_bin_trust_function_creators = 1; GRANT ALL PRIVILEGES ON *.* TO 'usayd'@'%'; FLUSH PRIVILEGES;"

      - name: Execute migrations on real MySQL 8.4 service
        run: php artisan migrate:fresh --no-interaction --force

      - name: Code style verification (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Verify architecture boundaries after bootstrap
        run: python scripts/verify_architecture_boundaries.py

      - name: Verify database foundations & anti-PostgreSQL rules
        run: python scripts/verify_database_foundations.py

      - name: Verify concurrency & idempotency harness
        run: python scripts/verify_concurrency_harness.py

      - name: Verify Redis queues & failed-job lifecycle
        run: python scripts/verify_queue_lifecycle.py

      - name: Start isolated S3-compatible test service
        run: |
          set -euo pipefail
          docker run -d --name usayd-ci-s3 \
            -p 127.0.0.1:9000:8333 \
            -e AWS_ACCESS_KEY_ID=usayd-ci-access \
            -e AWS_SECRET_ACCESS_KEY=usayd-ci-test-secret \
            chrislusf/seaweedfs:4.54
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            --max-time 5 --aws-sigv4 'aws:amz:us-east-1:s3' \
            --user 'usayd-ci-access:usayd-ci-test-secret' http://127.0.0.1:9000/

      - name: Install ClamAV engine for synthetic-signature tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          clamscan --version

      - name: Execute PHPUnit test suite
        run: php artisan test

      - name: Verify strict release readiness against isolated API
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_release_health.py
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          grep -qx 'APP_DEBUG=false' .env
          APP_ENV=production APP_DEBUG=false php artisan serve --host=127.0.0.1 --port=8000 > /tmp/usayd-readiness.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --max-time 5 http://127.0.0.1:8000/up
          python3 scripts/verify_release_health.py http://127.0.0.1:8000

      - name: OpenAPI Contract Validation
        run: bash scripts/check-openapi.sh

      - name: Verify compatibility and package implemented contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing comparison baseline"; exit 1; }
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          git show "$BASE_SHA:docs/api/implemented.openapi.json" > "$scratch/baseline.json"
          python3 -m unittest discover -s scripts/tests -p test_contract_publication.py
          python3 scripts/publish_api_contract.py --baseline "$scratch/baseline.json" \
            --current docs/api/implemented.openapi.json --commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/usayd-contract"
          cd "$RUNNER_TEMP/usayd-contract"
          sha256sum --check SHA256SUMS

      - name: Publish verified contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usayd-api-contract-${{ github.sha }}
          path: ${{ runner.temp }}/usayd-contract/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated S3-compatible test service
        if: always()
        run: docker rm -f usayd-ci-s3 || true
