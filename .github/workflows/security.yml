name: Supply chain security
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Validate and audit locked dependencies
        run: |
          set -euo pipefail
          composer --no-plugins --no-scripts validate --strict
          composer --no-plugins --no-scripts audit --locked --no-interaction
          git diff --exit-code -- composer.json composer.lock

      - name: Verify secret scanner and scan reachable Git history
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          scan() {
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              -v "$1:/scan:ro" "$GITLEAKS_IMAGE" "$2" --redact=100 --exit-code=42 /scan
          }
          printf '%s\n' 'synthetic clean fixture' > "$scratch/fixture.txt"
          scan "$scratch" dir
          # Deliberately synthetic format-only test key, never an actual credential.
          printf 'aws_access_key_id=%s%s\n' 'AKIA' 'Q7M2P4V6N3R5T7X2' > "$scratch/fixture.txt"
          result=0
          scan "$scratch" dir || result=$?
          test "$result" -eq 42
          mkdir "$scratch/report"
          result=0
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/scan:ro" -v "$scratch/report:/report" \
            "$GITLEAKS_IMAGE" git --redact=100 --log-opts=HEAD \
            --report-format=json --report-path=/report/findings.json /scan || result=$?
          if [ "$result" -ne 0 ]; then
            # Never print Secret, Match, surrounding source, or raw report.
            python3 - "$scratch/report/findings.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_file():
              for finding in json.loads(path.read_text()):
                  print(json.dumps({key: finding.get(key) for key in (
                      "RuleID", "File", "StartLine", "Commit", "Fingerprint"
                  )}, ensure_ascii=True))
          else:
              print("Secret scanner failed without a diagnostic report.")
          PY
          fi
          exit "$result"

      - name: Generate locked component SBOM
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_composer_sbom.py
          python3 scripts/generate_composer_sbom.py --output "$RUNNER_TEMP/usayd-composer.cdx.json"
      - name: Publish component inventory artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usayd-composer-sbom
          path: ${{ runner.temp }}/usayd-composer.cdx.json
          if-no-files-found: error
          retention-days: 14
